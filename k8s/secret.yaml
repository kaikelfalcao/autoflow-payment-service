apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: autoflow
type: Opaque
stringData:
  NODE_ENV: production
  PORT: "3004"

  # PostgreSQL — user dedicado do payment
  DB_HOST: "REPLACE_ME"
  DB_PORT: "5432"
  DB_USER: payment_user
  DB_PASS: "REPLACE_ME"
  DB_NAME: payment

  # RabbitMQ shared
  RABBITMQ_URL: "amqp://admin:REPLACE_ME@rabbitmq.autoflow.svc.cluster.local:5672"

  # Mercado Pago — em produção, secrets reais; em dev MP_MOCK=true
  MP_MOCK: "false"
  MP_ACCESS_TOKEN: "REPLACE_ME"
  MP_NOTIFICATION_URL: "https://<kong-public-host>/billing/webhook/mercadopago"

  NEW_RELIC_ENABLED: "false"
