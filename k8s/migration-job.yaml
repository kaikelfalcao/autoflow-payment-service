# Roda migrations do payment-service (charges, webhook_events).
# Usa o AppDataSource compilado em dist/data-source.js (rootDir=src no tsconfig.build).
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-migration
  namespace: autoflow
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: kaikelfalcao/autoflow-payment:latest
          command:
            - node
            - -e
            - |
              const { AppDataSource } = require('./dist/data-source');
              AppDataSource.initialize()
                .then(() => AppDataSource.runMigrations())
                .then((m) => {
                  console.log('Migrations:', m.length);
                  m.forEach(x => console.log(' -', x.name));
                  process.exit(0);
                })
                .catch((err) => {
                  console.error('Migration error:', err);
                  process.exit(1);
                });
          envFrom:
            - secretRef:
                name: payment-secrets
