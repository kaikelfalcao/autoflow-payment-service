name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Lint + Test + Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm run test:cov
      - run: npm run test:bdd --if-present

      # TODO: integrar SonarQube Community Edition (self-hosted) para emitir relatórios.
      # SonarCloud removido temporariamente — voltar com `sonar-scanner` apontando para a instância community.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
