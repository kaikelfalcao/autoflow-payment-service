name: CD

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: kaikelfalcao/autoflow-billing
  K8S_CLUSTER: fiap-tc-dev-eks
  K8S_NAMESPACE: billing
  K8S_DEPLOYMENT: billing

jobs:
  test:
    name: Lint + Format + Test + BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:bdd

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy → EKS
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.K8S_CLUSTER }}

      - name: Get billing DB + infra outputs from tfstate
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="fiap-tc-tfstate-${ACCOUNT_ID}"

          aws s3 cp "s3://${BUCKET}/billing-infra/terraform.tfstate" /tmp/billing.tfstate

          DB_HOST=$(jq -r '.outputs.db_address.value'    /tmp/billing.tfstate)
          DB_NAME=$(jq -r '.outputs.db_name.value'       /tmp/billing.tfstate)
          DB_USER=$(jq -r '.outputs.db_username.value'   /tmp/billing.tfstate)
          DB_PASS=$(jq -r '.outputs.db_password.value'   /tmp/billing.tfstate)
          RABBITMQ_URL=$(jq -r '.outputs.rabbitmq_url.value' /tmp/billing.tfstate)

          {
            echo "DB_HOST=${DB_HOST}"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_USER=${DB_USER}"
            echo "DB_PASS=${DB_PASS}"
            echo "RABBITMQ_URL=${RABBITMQ_URL}"
          } >> $GITHUB_ENV

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Update Kubernetes secret
        run: |
          kubectl create secret generic billing-secrets \
            -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=DB_HOST="${{ env.DB_HOST }}" \
            --from-literal=DB_USER="${{ env.DB_USER }}" \
            --from-literal=DB_PASS="${{ env.DB_PASS }}" \
            --from-literal=DB_NAME="${{ env.DB_NAME }}" \
            --from-literal=RABBITMQ_URL="${{ env.RABBITMQ_URL }}" \
            --from-literal=MP_ACCESS_TOKEN="${{ secrets.MP_ACCESS_TOKEN }}" \
            --from-literal=MP_NOTIFICATION_URL="${{ secrets.MP_NOTIFICATION_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run migrations
        run: |
          kubectl delete job billing-migration -n ${{ env.K8S_NAMESPACE }} 2>/dev/null || true

          sed "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" \
            k8s/migration-job.yaml | kubectl apply -f -

          kubectl wait --for=condition=complete job/billing-migration \
            -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Update image + rollout
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            billing=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s
